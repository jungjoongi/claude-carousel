<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="claude-carousel — one bash script, zero dependencies. Run several Claude Code accounts side by side and auto-rotate on a usage limit.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141821"/>
      <stop offset="55%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#171d26"/>
    </linearGradient>
    <linearGradient id="canopy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97757"/>
      <stop offset="100%" stop-color="#e9a03b"/>
    </linearGradient>
    <clipPath id="canopyClip">
      <path d="M -92 3 Q -73 -54 0 -79 Q 73 -54 92 3 Z"/>
    </clipPath>
    <style>
      .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- carousel motif -->
  <g transform="translate(210 250)">
    <path d="M -95 41 A 95 28 0 0 1 95 41" fill="none" stroke="#30363d" stroke-width="3"/>
    <path d="M0 -70 L0 41" stroke="#484f58" stroke-width="5" stroke-linecap="round"/>
    <path d="M-73 -10 L-84 32" stroke="#484f58" stroke-width="2.5"/>
    <path d="M73 -10 L84 32" stroke="#484f58" stroke-width="2.5"/>
    <path d="M0 -3 L0 63" stroke="#484f58" stroke-width="2.5"/>

    <path d="M -92 3 Q -73 -54 0 -79 Q 73 -54 92 3" fill="url(#canopy)"/>
    <g clip-path="url(#canopyClip)" opacity="0.28">
      <path d="M0 -79 L -48 6" stroke="#0d1117" stroke-width="14"/>
      <path d="M0 -79 L 48 6" stroke="#0d1117" stroke-width="14"/>
    </g>
    <path d="M -92 3
             a 15.3 12.6 0 0 0 30.6 0 a 15.3 12.6 0 0 0 30.6 0
             a 15.3 12.6 0 0 0 30.6 0 a 15.3 12.6 0 0 0 30.6 0
             a 15.3 12.6 0 0 0 30.6 0 a 15.3 12.6 0 0 0 30.6 0"
          fill="none" stroke="url(#canopy)" stroke-width="5.5" stroke-linecap="round"/>
    <circle cx="0" cy="-85" r="7" fill="#e9a03b"/>

    <circle cx="-84" cy="32" r="19" fill="#d97757"/>
    <circle cx="84" cy="32" r="19" fill="#3fb950" opacity="0.85"/>
    <circle cx="0" cy="63" r="19" fill="#5b8def"/>

    <path d="M -95 41 A 95 28 0 0 0 66 63" fill="none" stroke="#6e7681" stroke-width="3" stroke-linecap="round"/>
    <path d="M66 63 l -15 -5.5 l 4 13.5 z" fill="#6e7681"/>
  </g>

  <text class="sans" x="378" y="204" font-size="72" font-weight="700" fill="#e6edf3">claude-carousel</text>
  <text class="sans" x="380" y="256" font-size="30" font-weight="600" fill="#e9a03b">One bash script, zero dependencies.</text>
  <text class="sans" x="380" y="303" font-size="27" fill="#8b949e">Run several Claude Code accounts side by side —</text>
  <text class="sans" x="380" y="340" font-size="27" fill="#8b949e">and keep working when one hits its usage limit.</text>

  <!-- rotation strip -->
  <g transform="translate(380 396)">
    <rect width="780" height="132" rx="12" fill="#010409" stroke="#30363d"/>
    <g class="mono" font-size="21">
      <text x="26" y="44" fill="#3fb950">$</text>
      <text x="48" y="44" fill="#e6edf3">cc go</text>
      <text x="26" y="82" fill="#e9a03b">⚠ rate limit detected</text>
      <text x="26" y="112" fill="#8b949e">  switching to</text>
      <text x="190" y="112" fill="#d97757">work</text>
      <text x="253" y="112" fill="#8b949e">— same terminal, no re-login</text>
    </g>
  </g>

  <text class="mono" x="380" y="576" font-size="21" fill="#6e7681">github.com/jungjoongi/claude-carousel</text>
</svg>
